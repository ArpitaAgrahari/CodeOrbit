services:
  server:
    container_name: server
    build:
      context: ./server
      dockerfile: Dockerfile
      target: runner
    volumes:
      - ./server:/app
      - /build/node_modules
    networks:
      - CodeOrbit
    ports:
      - "3000:3000"

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    volumes:
      - ./frontend:/app
      - /build/node_modules
    networks:
      - CodeOrbit
    ports:
      - "5173:5173"
    depends_on:
      - server

networks:
  CodeOrbit:
    driver: bridge
